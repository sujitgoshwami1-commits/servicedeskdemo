<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServiceDesk — IT Support, Field Service &amp; Helpdesk Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A2420;
    --paper:#F5F3EE;
    --paper-2:#EDEAE1;
    --line:#DBD6C9;
    --teal:#2F6F5E;
    --teal-deep:#204F42;
    --rust:#C0562E;
    --rust-deep:#9E4423;
    --muted:#767F7B;
    --success:#3C8A5B;
    --danger:#B23B3B;
    --warn:#C79A2B;
    --card:#FFFFFF;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --shadow: 0 1px 2px rgba(26,36,32,0.06), 0 1px 0 rgba(26,36,32,0.04);
  }
  [data-theme="night"]{
    --ink:#EDEFEC;
    --paper:#121916;
    --paper-2:#182019;
    --line:#293832;
    --teal:#5BAF97;
    --teal-deep:#3E8A73;
    --rust:#E08556;
    --rust-deep:#C0562E;
    --muted:#8A968F;
    --card:#182420;
    --shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}

  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
  @media (max-width:860px){ .shell{grid-template-columns:1fr;} .sidebar{position:fixed;z-index:40;height:100vh;transform:translateX(-100%);transition:transform .2s ease;} .sidebar.open{transform:translateX(0);} }

  .sidebar{background:var(--paper-2);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:22px;}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 6px 10px;border-bottom:1px solid var(--line);}
  .brand-mark{width:30px;height:30px;border-radius:3px;background:var(--teal);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
  .brand-mark::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--paper-2);top:5px;right:5px;}
  .brand-mark svg{width:16px;height:16px;stroke:#fff;}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:15px;}
  .brand-tag{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.02em;}

  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:5px;color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:500;border:1px solid transparent;background:transparent;width:100%;text-align:left;}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75;}
  .nav-item:hover{background:var(--card);}
  .nav-item.active{background:var(--card);border-color:var(--line);box-shadow:var(--shadow);}
  .nav-item.active svg{opacity:1;color:var(--teal);stroke:var(--teal);}

  .sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;}
  .toggle-row{display:flex;gap:6px;}
  .toggle-btn{flex:1;padding:7px 6px;font-size:12px;border-radius:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;}
  .toggle-btn.active{background:var(--teal);color:#fff;border-color:var(--teal);}

  .main{padding:22px 26px 60px;max-width:1180px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .menu-btn{display:none;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:8px;}
  @media (max-width:860px){.menu-btn{display:inline-flex;}}
  .page-title{font-size:21px;font-weight:700;}
  .page-sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .search-add{display:flex;gap:8px;align-items:center;}
  .search-box{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:7px 10px;min-width:190px;}
  .search-box input{border:none;background:transparent;outline:none;color:var(--ink);font-size:13px;width:100%;}
  .search-box svg{width:14px;height:14px;opacity:.6;flex-shrink:0;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:5px;border:1px solid transparent;font-size:13px;font-weight:600;white-space:nowrap;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-deep);}
  .btn-ghost{background:var(--card);border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{background:var(--paper-2);}
  .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
  .btn-sm{padding:5px 9px;font-size:12px;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;box-shadow:var(--shadow);position:relative;}
  .stat-num{font-family:var(--font-display);font-size:26px;font-weight:700;}
  .stat-label{font-size:12px;color:var(--muted);margin-top:2px;}
  .stat-dot{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;}

  .ticket-grid{display:flex;flex-direction:column;gap:10px;}
  .ticket-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:13px 15px 13px 0;box-shadow:var(--shadow);display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;position:relative;}
  .ticket-card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--prio-color, var(--muted));}
  .ticket-id{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-left:14px;}
  .punch{width:9px;height:9px;border-radius:50%;background:var(--muted);}
  .punch.open{background:var(--warn);}
  .punch.progress{background:var(--teal);}
  .punch.resolved{background:var(--success);}
  .punch.closed{background:var(--muted);}
  .ticket-main .t-title{font-weight:600;font-size:14px;margin-bottom:3px;}
  .ticket-main .t-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px;font-family:var(--font-mono);}
  .tag-urgent{background:rgba(192,86,46,0.14);color:var(--rust-deep);}
  .tag-high{background:rgba(199,154,43,0.16);color:#8a6a1c;}
  .tag-medium{background:rgba(47,111,94,0.13);color:var(--teal-deep);}
  .tag-low{background:rgba(118,127,123,0.15);color:var(--muted);}
  .ticket-actions{display:flex;gap:6px;padding-right:6px;}

  .list-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:13px 15px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px;flex-wrap:wrap;}
  .list-main{display:flex;align-items:center;gap:12px;}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--teal-deep);border:1px solid var(--line);flex-shrink:0;}
  .list-title{font-weight:600;font-size:13.5px;}
  .list-sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .list-actions{display:flex;gap:6px;}
  .pill{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--paper-2);border:1px solid var(--line);font-weight:600;}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;font-size:13px;}
  .empty svg{width:34px;height:34px;opacity:.4;margin-bottom:10px;}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
  .section-head h3{font-size:14.5px;}
  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .filter-row select, .filter-row input{padding:7px 10px;border-radius:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12.5px;}

  .overlay{position:fixed;inset:0;background:rgba(18,25,22,0.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100;}
  .overlay.show{display:flex;}
  .modal{background:var(--paper);border:1px solid var(--line);border-radius:8px;width:100%;max-width:520px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,0.2);}
  .modal h3{font-size:16px;margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--muted);}
  .field input, .field select, .field textarea{width:100%;padding:9px 10px;border-radius:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;outline:none;}
  .field textarea{resize:vertical;min-height:70px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;}
  [data-theme="night"] .toast{background:#EDEFEC;color:#121916;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .kb-item{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:9px;box-shadow:var(--shadow);}
  .kb-item summary{cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  .kb-item summary::-webkit-details-marker{display:none;}
  .kb-item .kb-body{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.6;}
  .kb-cat{font-family:var(--font-mono);font-size:10.5px;color:var(--teal);}

  .bar-wrap{display:flex;flex-direction:column;gap:9px;}
  .bar-row{display:grid;grid-template-columns:100px 1fr 40px;gap:10px;align-items:center;font-size:12px;}
  .bar-track{background:var(--paper-2);border-radius:3px;height:9px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--teal);border-radius:3px;}

  ::placeholder{color:var(--muted);opacity:.7;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px;}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.77z"/></svg>
      </div>
      <div>
        <div class="brand-name">ServiceDesk</div>
        <div class="brand-tag">Tickets · Field · Helpdesk</div>
      </div>
    </div>
    <nav class="nav" id="navList">
      <button class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="tickets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9a3 3 0 1 0 0 6"/><path d="M6 5h15v4a2 2 0 0 0 0 4v2a2 2 0 0 0 0 4v4H6z"/></svg>
        <span>Tickets</span>
      </button>
      <button class="nav-item" data-view="fieldjobs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20V9l-8-6-8 6v11"/><path d="M9 20v-6h6v6"/></svg>
        <span>Field Jobs</span>
      </button>
      <button class="nav-item" data-view="clients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Clients</span>
      </button>
      <button class="nav-item" data-view="agents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span>Agents</span>
      </button>
      <button class="nav-item" data-view="kb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Knowledge Base</span>
      </button>
      <button class="nav-item" data-view="reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/></svg>
        <span>Reports</span>
      </button>
    </nav>
    <div class="sidebar-foot">
      <div class="toggle-row">
        <button class="toggle-btn active" id="btnDay">Day</button>
        <button class="toggle-btn" id="btnNight">Night</button>
      </div>
      <button class="nav-item btn-danger" id="btnReset" style="border:1px solid var(--line);">
        <span>Reset Demo Data</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div>
        <div class="page-title" id="pageTitle">Dashboard</div>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <div class="search-add">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Search tickets, clients, agents...">
        </div>
        <button class="btn btn-primary" id="btnQuickAdd">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          <span id="quickAddLabel">New Ticket</span>
        </button>
      </div>
    </div>
    <div id="viewRoot"></div>
  </main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ Strings ============ */
const STR = {
  dashboard:"Dashboard", tickets:"Tickets", fieldjobs:"Field Jobs", clients:"Clients", agents:"Agents", kb:"Knowledge Base", reports:"Reports",
  sub_dashboard:"An overview of everything happening right now",
  sub_tickets:"Manage support tickets end to end",
  sub_fieldjobs:"On-site service calls and scheduling",
  sub_clients:"Client details and ticket history",
  sub_agents:"Team members and assignments",
  sub_kb:"Store solutions and internal guidelines",
  sub_reports:"Performance and trend analysis",
  newTicket:"New Ticket", newJob:"New Job", newClient:"New Client", newAgent:"New Agent", newArticle:"New Article",
  open:"Open", inprogress:"In Progress", resolved:"Resolved", closed:"Closed",
  urgent:"Urgent", high:"High", medium:"Medium", low:"Low",
  edit:"Edit", delete:"Delete", save:"Save", cancel:"Cancel",
  title:"Title", description:"Description", client:"Client", agent:"Agent", priority:"Priority", status:"Status",
  category:"Category", phone:"Phone", email:"Email", company:"Company", address:"Address", role:"Role",
  scheduledDate:"Scheduled Date", location:"Location", notes:"Notes",
  noTickets:"No tickets yet. Create your first one.",
  noJobs:"No field jobs scheduled yet.",
  noClients:"No clients added yet.",
  noAgents:"No agents added yet.",
  noKb:"No knowledge base articles yet.",
  totalTickets:"Total Tickets", openTickets:"Open Tickets", resolvedToday:"Resolved Today", activeJobs:"Active Field Jobs",
  ticketsByStatus:"Tickets by Status", ticketsByAgent:"Tickets by Agent", recentTickets:"Recent Tickets",
  allStatus:"All Status", allPriority:"All Priority", allAgents:"All Agents",
  confirmDelete:"Are you sure you want to delete this?", saved:"Saved", deleted:"Deleted",
  resetConfirm:"This will reset all demo data. Continue?", resetDone:"Demo data reset",
  unassigned:"Unassigned", noClient:"No client",
  tickets_label:"tickets", clients:"Clients", agents:"Agents",
};
function t(key){ return STR[key] || key; }

/* ============ Data model ============ */
const STORE_KEY = 'servicedesk_data_v1';
function seedData(){
  return {
    clients:[
      {id:'c1', name:'Riverside Retail Group', company:'Riverside Retail Group', phone:'+1 (555) 201-3344', email:'ops@riversideretail.com', address:'Austin, TX'},
      {id:'c2', name:'Nadia Foster', company:'Foster Design Studio', phone:'+1 (555) 402-8871', email:'nadia@fosterdesign.com', address:'Manchester, UK'},
      {id:'c3', name:'Green Valley Academy', company:'Green Valley Academy', phone:'+1 (555) 665-2290', email:'admin@greenvalleyacademy.edu', address:'Toronto, CA'},
    ],
    agents:[
      {id:'a1', name:'Marcus Chen', role:'Senior Technician', email:'marcus@servicedesk.com', phone:'+1 (555) 771-1023'},
      {id:'a2', name:'Priya Anand', role:'Support Agent', email:'priya@servicedesk.com', phone:'+1 (555) 886-4455'},
    ],
    tickets:[
      {id:'T-1001', title:'Printer not connecting to network', description:'Office printer loses WiFi connection every few hours.', clientId:'c1', agentId:'a1', priority:'high', status:'progress', category:'Hardware', createdAt: daysAgo(2)},
      {id:'T-1002', title:'Cannot login to billing portal', description:'User forgot password; reset link not arriving via email.', clientId:'c2', agentId:'a2', priority:'medium', status:'open', category:'Software', createdAt: daysAgo(1)},
      {id:'T-1003', title:'Server down - urgent', description:'Main file server unreachable since this morning.', clientId:'c3', agentId:'a1', priority:'urgent', status:'open', category:'Network', createdAt: daysAgo(0)},
      {id:'T-1004', title:'Slow computer performance', description:'Front desk PC takes 10 minutes to boot.', clientId:'c1', agentId:'a2', priority:'low', status:'resolved', category:'Hardware', createdAt: daysAgo(5)},
    ],
    fieldJobs:[
      {id:'J-501', title:'Install new router', clientId:'c3', agentId:'a1', scheduledDate: futureDate(1), location:'Toronto campus', status:'scheduled', notes:'Bring spare cables'},
      {id:'J-502', title:'On-site printer repair', clientId:'c1', agentId:'a2', scheduledDate: futureDate(0), location:'Austin office', status:'in_progress', notes:''},
    ],
    kb:[
      {id:'k1', title:'How to reset a client router', category:'Network', body:'Hold the reset button for 10 seconds, wait for all lights to blink, then reconfigure using the ISP default credentials.'},
      {id:'k2', title:'Standard printer troubleshooting checklist', category:'Hardware', body:'Check power and USB/WiFi connection, clear print queue, update driver, run manufacturer diagnostic tool.'},
      {id:'k3', title:'Password reset email not arriving', category:'Software', body:'Check spam folder first, confirm email on file is correct, then trigger a manual reset from the admin panel.'},
    ]
  };
}
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); }
function futureDate(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

const SEED_DATE_KEY = 'servicedesk_seed_date';
function todayStr(){ return new Date().toDateString(); }
function loadData(){
  const today = todayStr();
  const lastSeedDate = localStorage.getItem(SEED_DATE_KEY);
  let raw = localStorage.getItem(STORE_KEY);
  // Auto-reset to fresh demo data once the calendar day changes (local time),
  // so a public demo always looks clean the next time someone visits.
  if(!raw || lastSeedDate !== today){
    const seed = seedData();
    localStorage.setItem(STORE_KEY, JSON.stringify(seed));
    localStorage.setItem(SEED_DATE_KEY, today);
    return seed;
  }
  try{ return JSON.parse(raw); }
  catch(e){ const seed = seedData(); localStorage.setItem(STORE_KEY, JSON.stringify(seed)); localStorage.setItem(SEED_DATE_KEY, today); return seed; }
}
function saveData(){ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }
let DATA = loadData();

/* ============ State ============ */
let currentView = 'dashboard';
let searchTerm = '';
let ticketFilterStatus = 'all';
let ticketFilterPriority = 'all';
let ticketFilterAgent = 'all';

/* ============ Helpers ============ */
function uid(prefix){ return prefix + '-' + Math.floor(1000 + Math.random()*9000); }
function findClient(id){ return DATA.clients.find(c=>c.id===id); }
function findAgent(id){ return DATA.agents.find(a=>a.id===id); }
function showToast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 1800); }
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

const STATUS_LABEL = {open:t('open'), progress:t('inprogress'), resolved:t('resolved'), closed:t('closed'), scheduled:'Scheduled', in_progress:t('inprogress'), completed:'Completed'};
const PRIORITY_LABEL = {urgent:t('urgent'), high:t('high'), medium:t('medium'), low:t('low')};
const PRIORITY_COLOR = {urgent:'var(--rust)', high:'var(--warn)', medium:'var(--teal)', low:'var(--muted)'};

/* ============ Rendering: Router ============ */
const viewRoot = document.getElementById('viewRoot');
const quickAddLabel = document.getElementById('quickAddLabel');
const pageSub = document.getElementById('pageSub');

function setView(view){
  currentView = view;
  document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  document.getElementById('pageTitle').textContent = t(view);
  pageSub.textContent = t('sub_'+view);
  const addLabels = {dashboard:'newTicket', tickets:'newTicket', fieldjobs:'newJob', clients:'newClient', agents:'newAgent', kb:'newArticle', reports:'newTicket'};
  quickAddLabel.textContent = t(addLabels[view] || 'newTicket');
  document.getElementById('btnQuickAdd').style.display = view==='reports' ? 'none':'inline-flex';
  render();
  document.getElementById('sidebar').classList.remove('open');
}

function render(){
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='tickets') renderTickets();
  else if(currentView==='fieldjobs') renderFieldJobs();
  else if(currentView==='clients') renderClients();
  else if(currentView==='agents') renderAgents();
  else if(currentView==='kb') renderKb();
  else if(currentView==='reports') renderReports();
}

/* ---------- Dashboard ---------- */
function renderDashboard(){
  const total = DATA.tickets.length;
  const open = DATA.tickets.filter(x=>x.status==='open'||x.status==='progress').length;
  const resolvedToday = DATA.tickets.filter(x=> x.status==='resolved' ).length;
  const activeJobs = DATA.fieldJobs.filter(j=>j.status!=='completed').length;

  let html = `<div class="stat-row">
    <div class="stat-card"><div class="stat-dot" style="background:var(--teal)"></div><div class="stat-num">${total}</div><div class="stat-label">${t('totalTickets')}</div></div>
    <div class="stat-card"><div class="stat-dot" style="background:var(--warn)"></div><div class="stat-num">${open}</div><div class="stat-label">${t('openTickets')}</div></div>
    <div class="stat-card"><div class="stat-dot" style="background:var(--success)"></div><div class="stat-num">${resolvedToday}</div><div class="stat-label">${t('resolvedToday')}</div></div>
    <div class="stat-card"><div class="stat-dot" style="background:var(--rust)"></div><div class="stat-num">${activeJobs}</div><div class="stat-label">${t('activeJobs')}</div></div>
  </div>`;

  const statuses = ['open','progress','resolved','closed'];
  const maxCount = Math.max(1, ...statuses.map(s=>DATA.tickets.filter(x=>x.status===s).length));
  html += `<div class="section-head"><h3>${t('ticketsByStatus')}</h3></div><div class="bar-wrap">`;
  statuses.forEach(s=>{
    const count = DATA.tickets.filter(x=>x.status===s).length;
    const pct = Math.round((count/maxCount)*100);
    html += `<div class="bar-row"><div>${STATUS_LABEL[s]}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div>${count}</div></div>`;
  });
  html += `</div>`;

  html += `<div class="section-head"><h3>${t('ticketsByAgent')}</h3></div><div class="bar-wrap">`;
  const maxAgentCount = Math.max(1, ...DATA.agents.map(a=>DATA.tickets.filter(x=>x.agentId===a.id).length));
  DATA.agents.forEach(a=>{
    const count = DATA.tickets.filter(x=>x.agentId===a.id).length;
    const pct = Math.round((count/maxAgentCount)*100);
    html += `<div class="bar-row"><div>${a.name}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--rust)"></div></div><div>${count}</div></div>`;
  });
  html += `</div>`;

  html += `<div class="section-head"><h3>${t('recentTickets')}</h3></div>`;
  const recent = [...DATA.tickets].sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt)).slice(0,4);
  html += ticketListHtml(recent, true);

  viewRoot.innerHTML = html;
  bindTicketActions();
}

/* ---------- Tickets ---------- */
function ticketListHtml(list, compact){
  if(list.length===0) return `<div class="empty">${emptyIcon()}<div>${t('noTickets')}</div></div>`;
  return `<div class="ticket-grid">` + list.map(tk=>{
    const client = findClient(tk.clientId);
    const agent = findAgent(tk.agentId);
    const prioClass = 'tag-'+tk.priority;
    const punchClass = tk.status;
    return `<div class="ticket-card" style="--prio-color:${PRIORITY_COLOR[tk.priority]}">
      <div class="ticket-id"><span class="punch ${punchClass}"></span>${tk.id}</div>
      <div class="ticket-main">
        <div class="t-title">${escapeHtml(tk.title)}</div>
        <div class="t-meta">
          <span class="tag ${prioClass}">${PRIORITY_LABEL[tk.priority]}</span>
          <span>${STATUS_LABEL[tk.status]}</span>
          <span>${client? escapeHtml(client.name) : t('noClient')}</span>
          <span>${agent? escapeHtml(agent.name) : t('unassigned')}</span>
          <span>${fmtDate(tk.createdAt)}</span>
        </div>
      </div>
      ${compact? '' : `<div class="ticket-actions">
        <button class="btn btn-ghost btn-sm" data-edit-ticket="${tk.id}">${t('edit')}</button>
        <button class="btn btn-danger btn-sm" data-del-ticket="${tk.id}">${t('delete')}</button>
      </div>`}
    </div>`;
  }).join('') + `</div>`;
}

function renderTickets(){
  let list = DATA.tickets.filter(tk=>{
    const client = findClient(tk.clientId); const agent = findAgent(tk.agentId);
    const hay = (tk.title+' '+tk.description+' '+(client?client.name:'')+' '+(agent?agent.name:'')).toLowerCase();
    if(searchTerm && !hay.includes(searchTerm.toLowerCase())) return false;
    if(ticketFilterStatus!=='all' && tk.status!==ticketFilterStatus) return false;
    if(ticketFilterPriority!=='all' && tk.priority!==ticketFilterPriority) return false;
    if(ticketFilterAgent!=='all' && tk.agentId!==ticketFilterAgent) return false;
    return true;
  }).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));

  let html = `<div class="filter-row">
    <select id="filterStatus">
      <option value="all">${t('allStatus')}</option>
      <option value="open">${t('open')}</option>
      <option value="progress">${t('inprogress')}</option>
      <option value="resolved">${t('resolved')}</option>
      <option value="closed">${t('closed')}</option>
    </select>
    <select id="filterPriority">
      <option value="all">${t('allPriority')}</option>
      <option value="urgent">${t('urgent')}</option>
      <option value="high">${t('high')}</option>
      <option value="medium">${t('medium')}</option>
      <option value="low">${t('low')}</option>
    </select>
    <select id="filterAgent">
      <option value="all">${t('allAgents')}</option>
      ${DATA.agents.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}
    </select>
  </div>`;
  html += ticketListHtml(list, false);
  viewRoot.innerHTML = html;

  document.getElementById('filterStatus').value = ticketFilterStatus;
  document.getElementById('filterPriority').value = ticketFilterPriority;
  document.getElementById('filterAgent').value = ticketFilterAgent;
  document.getElementById('filterStatus').onchange = e=>{ ticketFilterStatus = e.target.value; renderTickets(); };
  document.getElementById('filterPriority').onchange = e=>{ ticketFilterPriority = e.target.value; renderTickets(); };
  document.getElementById('filterAgent').onchange = e=>{ ticketFilterAgent = e.target.value; renderTickets(); };
  bindTicketActions();
}

function bindTicketActions(){
  document.querySelectorAll('[data-edit-ticket]').forEach(b=> b.onclick = ()=> openTicketModal(b.dataset.editTicket));
  document.querySelectorAll('[data-del-ticket]').forEach(b=> b.onclick = ()=>{
    if(confirm(t('confirmDelete'))){
      DATA.tickets = DATA.tickets.filter(x=>x.id!==b.dataset.delTicket);
      saveData(); showToast(t('deleted')); render();
    }
  });
}

function openTicketModal(id){
  const existing = id ? DATA.tickets.find(x=>x.id===id) : null;
  const modal = document.getElementById('modalBody');
  modal.innerHTML = `
    <h3>${existing? t('edit'): t('newTicket')}</h3>
    <div class="field"><label>${t('title')}</label><input id="f_title" value="${existing? escapeAttr(existing.title):''}"></div>
    <div class="field"><label>${t('description')}</label><textarea id="f_desc">${existing? escapeHtml(existing.description):''}</textarea></div>
    <div class="field-row">
      <div class="field"><label>${t('client')}</label><select id="f_client"><option value="">${t('noClient')}</option>${DATA.clients.map(c=>`<option value="${c.id}" ${existing&&existing.clientId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
      <div class="field"><label>${t('agent')}</label><select id="f_agent"><option value="">${t('unassigned')}</option>${DATA.agents.map(a=>`<option value="${a.id}" ${existing&&existing.agentId===a.id?'selected':''}>${escapeHtml(a.name)}</option>`).join('')}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>${t('priority')}</label><select id="f_priority">
        ${['urgent','high','medium','low'].map(p=>`<option value="${p}" ${existing&&existing.priority===p?'selected':''}>${PRIORITY_LABEL[p]}</option>`).join('')}
      </select></div>
      <div class="field"><label>${t('status')}</label><select id="f_status">
        ${['open','progress','resolved','closed'].map(s=>`<option value="${s}" ${existing&&existing.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}
      </select></div>
    </div>
    <div class="field"><label>${t('category')}</label><input id="f_category" value="${existing? escapeAttr(existing.category||''):''}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">${t('cancel')}</button>
      <button class="btn btn-primary" id="modalSave">${t('save')}</button>
    </div>
  `;
  openOverlay();
  document.getElementById('modalCancel').onclick = closeOverlay;
  document.getElementById('modalSave').onclick = ()=>{
    const title = document.getElementById('f_title').value.trim();
    if(!title){ document.getElementById('f_title').focus(); return; }
    const obj = {
      id: existing? existing.id : uid('T'),
      title,
      description: document.getElementById('f_desc').value.trim(),
      clientId: document.getElementById('f_client').value || null,
      agentId: document.getElementById('f_agent').value || null,
      priority: document.getElementById('f_priority').value,
      status: document.getElementById('f_status').value,
      category: document.getElementById('f_category').value.trim(),
      createdAt: existing? existing.createdAt : new Date().toISOString(),
    };
    if(existing){ DATA.tickets = DATA.tickets.map(x=>x.id===existing.id?obj:x); }
    else { DATA.tickets.unshift(obj); }
    saveData(); showToast(t('saved')); closeOverlay(); render();
  };
}

/* ---------- Field Jobs ---------- */
function renderFieldJobs(){
  let list = DATA.fieldJobs.filter(j=>{
    const client = findClient(j.clientId);
    const hay = (j.title+' '+(client?client.name:'')+' '+j.location).toLowerCase();
    return !searchTerm || hay.includes(searchTerm.toLowerCase());
  }).sort((a,b)=> new Date(a.scheduledDate)-new Date(b.scheduledDate));

  if(list.length===0){ viewRoot.innerHTML = `<div class="empty">${emptyIcon()}<div>${t('noJobs')}</div></div>`; return; }

  const statusLabels = {scheduled:'Scheduled', in_progress: t('inprogress'), completed:'Completed'};
  let html = `<div class="ticket-grid">` + list.map(j=>{
    const client = findClient(j.clientId); const agent = findAgent(j.agentId);
    return `<div class="list-card">
      <div class="list-main">
        <div class="avatar">${initials(j.title)}</div>
        <div>
          <div class="list-title">${escapeHtml(j.title)}</div>
          <div class="list-sub">${client? escapeHtml(client.name):t('noClient')} · ${escapeHtml(j.location||'')} · ${fmtDate(j.scheduledDate)}</div>
          <div class="list-sub">${agent? escapeHtml(agent.name): t('unassigned')} · <span class="pill">${statusLabels[j.status]||j.status}</span></div>
        </div>
      </div>
      <div class="list-actions">
        <button class="btn btn-ghost btn-sm" data-edit-job="${j.id}">${t('edit')}</button>
        <button class="btn btn-danger btn-sm" data-del-job="${j.id}">${t('delete')}</button>
      </div>
    </div>`;
  }).join('') + `</div>`;
  viewRoot.innerHTML = html;
  document.querySelectorAll('[data-edit-job]').forEach(b=> b.onclick=()=>openJobModal(b.dataset.editJob));
  document.querySelectorAll('[data-del-job]').forEach(b=> b.onclick=()=>{
    if(confirm(t('confirmDelete'))){ DATA.fieldJobs = DATA.fieldJobs.filter(x=>x.id!==b.dataset.delJob); saveData(); showToast(t('deleted')); render(); }
  });
}

  viewRoot.innerHTML = html;
  document.querySelectorAll('[data-edit-kb]').forEach(b=> b.onclick=()=>openKbModal(b.dataset.editKb));
  document.querySelectorAll('[data-del-kb]').forEach(b=> b.onclick=()=>{
    if(confirm(t('confirmDelete'))){ DATA.kb = DATA.kb.filter(x=>x.id!==b.dataset.delKb); saveData(); showToast(t('deleted')); render(); }
  });
}
function openKbModal(id){
  const existing = id ? DATA.kb.find(x=>x.id===id) : null;
  const modal = document.getElementById('modalBody');
  modal.innerHTML = `
    <h3>${existing? t('edit'): t('newArticle')}</h3>
    <div class="field"><label>${t('title')}</label><input id="f_title" value="${existing?escapeAttr(existing.title):''}"></div>
    <div class="field"><label>${t('category')}</label><input id="f_category" value="${existing?escapeAttr(existing.category||''):''}"></div>
    <div class="field"><label>${t('description')}</label><textarea id="f_body">${existing?escapeHtml(existing.body||''):''}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">${t('cancel')}</button>
      <button class="btn btn-primary" id="modalSave">${t('save')}</button>
    </div>`;
  openOverlay();
  document.getElementById('modalCancel').onclick = closeOverlay;
  document.getElementById('modalSave').onclick = ()=>{
    const title = document.getElementById('f_title').value.trim();
    if(!title) return;
    const obj = { id: existing? existing.id: uid('k'), title, category: document.getElementById('f_category').value.trim(), body: document.getElementById('f_body').value.trim() };
    if(existing){ DATA.kb = DATA.kb.map(x=>x.id===existing.id?obj:x); } else { DATA.kb.push(obj); }
    saveData(); showToast(t('saved')); closeOverlay(); render();
  };
}

/* ---------- Reports ---------- */
function renderReports(){
  const total = DATA.tickets.length || 1;
  const resolved = DATA.tickets.filter(x=>x.status==='resolved'||x.status==='closed').length;
  const resolutionRate = Math.round((resolved/total)*100);
  const upcomingJobs = DATA.fieldJobs.filter(j=>j.status!=='completed').length;

  let html = `<div class="stat-row">
    <div class="stat-card"><div class="stat-num">${resolutionRate}%</div><div class="stat-label">Resolution Rate</div></div>
    <div class="stat-card"><div class="stat-num">${upcomingJobs}</div><div class="stat-label">Active Field Jobs</div></div>
    <div class="stat-card"><div class="stat-num">${DATA.clients.length}</div><div class="stat-label">Clients</div></div>
    <div class="stat-card"><div class="stat-num">${DATA.agents.length}</div><div class="stat-label">Agents</div></div>
  </div>`;

  html += `<div class="section-head"><h3>${t('ticketsByStatus')}</h3></div><div class="bar-wrap">`;
  const statuses = ['open','progress','resolved','closed'];
  const maxCount = Math.max(1, ...statuses.map(s=>DATA.tickets.filter(x=>x.status===s).length));
  statuses.forEach(s=>{
    const count = DATA.tickets.filter(x=>x.status===s).length;
    const pct = Math.round((count/maxCount)*100);
    html += `<div class="bar-row"><div>${STATUS_LABEL[s]}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div>${count}</div></div>`;
  });
  html += `</div>`;

  html += `<div class="section-head"><h3>${t('ticketsByAgent')}</h3></div><div class="bar-wrap">`;
  const maxAgentCount = Math.max(1, ...DATA.agents.map(a=>DATA.tickets.filter(x=>x.agentId===a.id).length));
  DATA.agents.forEach(a=>{
    const count = DATA.tickets.filter(x=>x.agentId===a.id).length;
    const pct = Math.round((count/maxAgentCount)*100);
    html += `<div class="bar-row"><div>${a.name}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--rust)"></div></div><div>${count}</div></div>`;
  });
  html += `</div>`;
  viewRoot.innerHTML = html;
}

/* ============ Misc UI helpers ============ */
function emptyIcon(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6M9 16h6M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M13 3v5h5"/></svg>`; }
function escapeHtml(str){ if(str==null) return ''; return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str){ return escapeHtml(str); }
function openOverlay(){ document.getElementById('overlay').classList.add('show'); }
function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeOverlay(); });

/* ============ Nav & top bar bindings ============ */
document.querySelectorAll('.nav-item[data-view]').forEach(b=> b.onclick = ()=> setView(b.dataset.view));
document.getElementById('menuBtn').onclick = ()=> document.getElementById('sidebar').classList.toggle('open');
document.getElementById('searchInput').addEventListener('input', (e)=>{ searchTerm = e.target.value; render(); });

document.getElementById('btnQuickAdd').onclick = ()=>{
  if(currentView==='tickets'||currentView==='dashboard') openTicketModal(null);
  else if(currentView==='fieldjobs') openJobModal(null);
  else if(currentView==='clients') openClientModal(null);
  else if(currentView==='agents') openAgentModal(null);
  else if(currentView==='kb') openKbModal(null);
};

document.getElementById('btnReset').onclick = ()=>{
  if(confirm(t('resetConfirm'))){
    DATA = seedData(); saveData(); showToast(t('resetDone')); render();
  }
};

/* ---------- Theme toggle ---------- */
let theme = localStorage.getItem('sd_theme') || 'day';
function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme==='day'?'day':'night');
  document.getElementById('btnDay').classList.toggle('active', theme==='day');
  document.getElementById('btnNight').classList.toggle('active', theme==='night');
}
document.getElementById('btnDay').onclick = ()=>{ theme='day'; localStorage.setItem('sd_theme','day'); applyTheme(); };
document.getElementById('btnNight').onclick = ()=>{ theme='night'; localStorage.setItem('sd_theme','night'); applyTheme(); };

/* ---------- Init ---------- */
applyTheme();
setView('dashboard');
</script>
</body>
</html>
